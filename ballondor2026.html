<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ballon d'Or 2026</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 3rem 1rem; }
    h1 { color: #facc15; }
    .finalistes { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; margin-top: 2rem; }
    .carte { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem 2rem; min-width: 220px; }
    .carte h2 { margin: 0 0 .5rem; }
    .winner { margin-top: 3rem; color: #facc15; font-size: 1.8rem; }
  </style>
</head>
<body>
  <h1>🏆 Ballon d'Or 2026</h1>
  <h3>Les trois finalistes</h3>
  <div class="finalistes">
    <div class="carte"><h2>Harry Kane</h2><p>Angleterre, Bayern Munich</p></div>
    <div class="carte"><h2>Kylian Mbappé</h2><p>France, Real Madrid</p></div>
    <div class="carte"><h2>Lamine Yamal</h2><p>Espagne, Barça</p></div>
  </div>
  <h2 class="winner">🏆 Vainqueur : Harry Kane (Angleterre, Bayern Munich)</h2>
</body>
</html>
